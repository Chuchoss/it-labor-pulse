# LMA CI/CD gate: test first, then deploy.
# Docs: docs/architecture/10-cicd.md, 13-testing.md
#
# Branch model:
#   developer  → deploy-dev  (environment: development)
#   production → deploy-prod (environment: production, require reviewers on GitHub)
#
# Required status check for branch protection: job name "test"

name: ci-cd

on:
  pull_request:
    branches: [developer, production]
  push:
    branches: [developer, production]

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Gate: always runs on PR + push. Deploy jobs need this to succeed.
  # ---------------------------------------------------------------------------
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block accidental .env commit
        run: |
          set -euo pipefail
          if [ -f .env ]; then
            echo "::error::.env must not be in the repository (see .gitignore / 17-secrets-management.md)"
            exit 1
          fi
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git — remove it and rotate secrets"
            exit 1
          fi
          echo ".env not present / not tracked — OK"

      - name: Check OpenAPI stub present
        run: |
          set -euo pipefail
          test -f api/openapi.yaml
          # Minimal shape checks (fail the gate if the contract stub is broken)
          grep -qE '^openapi:[[:space:]]' api/openapi.yaml
          grep -qE '^paths:|^  /' api/openapi.yaml
          echo "openapi.yaml OK"

      - name: Check env template present
        run: |
          set -euo pipefail
          test -f .env.example
          echo ".env.example OK"

      - name: Go unit tests (graceful if no modules yet)
        run: |
          set -euo pipefail
          if [ -f go.mod ] || [ -f go.work ] || \
             find . -path ./.git -prune -o -name go.mod -print -quit | grep -q .; then
            echo "Go module(s) detected — running unit tests"
            go test ./...
          else
            echo "No go.mod / go.work yet — skipping go test (enable when modules land; see 13-testing.md)"
          fi

      # --- TODO (when Go modules appear): lint ---
      # - name: Setup Go
      #   uses: actions/setup-go@v5
      #   with:
      #     go-version-file: go.work   # or go.mod path
      # - name: golangci-lint
      #   uses: golangci/golangci-lint-action@v6

      # --- TODO (when apps/web exists): frontend unit ---
      # - name: Setup Node
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: "22"
      #     cache: npm
      #     cache-dependency-path: apps/web/package-lock.json
      # - name: Vitest
      #   working-directory: apps/web
      #   run: npm ci && npm test

      # --- TODO (when libs/proto + buf.yaml exist): contract ---
      # - name: buf lint / breaking
      #   uses: bufbuild/buf-action@v1
      #   with:
      #     lint: true
      #     breaking: true
      #     breaking_against: "https://github.com/${{ github.repository }}.git#branch=production"

      # --- TODO (push production only): integration + migrate smoke ---
      # - name: Go integration tests
      #   if: github.event_name == 'push' && github.ref == 'refs/heads/production'
      #   run: go test -tags=integration ./...

      - name: CI gate summary
        run: |
          echo "Gate job 'test' passed critical checks (OpenAPI, no .env, go test if modules exist)."
          echo "Suite intent:"
          echo "  PR + developer: lint + unit + contract lite"
          echo "  production push: + integration (when code exists)"
          if [ "${{ github.ref }}" = "refs/heads/production" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "production push: stricter gate path (integration TODO)"
          fi

  # ---------------------------------------------------------------------------
  # Deploy only after green test; never on PR / forks.
  # ---------------------------------------------------------------------------
  deploy-dev:
    name: deploy-dev
    needs: [test]
    if: >
      github.event_name == 'push'
      && github.ref == 'refs/heads/developer'
      && github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: development
    permissions:
      contents: read
      # packages: write   # TODO: when pushing to GHCR
      # id-token: write   # TODO: when using OIDC to cloud
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to development (stub)
        run: |
          echo "TODO: build/push images, migrate Job, kubectl/helm to lma-dev"
          echo "Secrets: GitHub Environment 'development' (see docs/architecture/17-secrets-management.md)"
          echo "Never deploy on failed tests — this job has needs: [test]"

      # --- TODO Phase 3+ ---
      # - name: Build and push images
      # - name: Configure kube / OIDC
      # - name: Run migrate Job
      # - name: Rollout apps
      # - name: Smoke curl /api/v1/health

  deploy-prod:
    name: deploy-prod
    needs: [test]
    if: >
      github.event_name == 'push'
      && github.ref == 'refs/heads/production'
      && github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      # packages: write
      # id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to production (stub)
        run: |
          echo "TODO: promote same image digest, migrate, rollout lma-prod"
          echo "Enable Required reviewers on Environment 'production' in GitHub Settings"
          echo "Secrets: GitHub Environment 'production' only (not shared with development)"

      # --- TODO Phase 3+ ---
      # - name: Build and push images (or promote digest from dev)
      # - name: Configure kube / OIDC
      # - name: Run migrate Job
      # - name: Rollout apps
      # - name: Smoke curl /api/v1/health (+ optional 1 Playwright)
