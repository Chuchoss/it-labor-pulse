# Publish OpenAPI docs (Redoc + Swagger UI) to GitHub Pages.
# Docs: docs/architecture/10-cicd.md, 22-documentation-style.md, ADR 008
#
# Enable once (repo Settings → Pages):
#   Source = GitHub Actions
#
# URL after first successful deploy:
#   https://<user-or-org>.github.io/<repo>/

name: docs-pages

on:
  push:
    branches: [main]
    paths:
      - "api/openapi.yaml"
      - "docs/api-site/**"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy OpenAPI into site (source of truth stays api/openapi.yaml)
        run: cp api/openapi.yaml docs/api-site/openapi.yaml

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api-site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
