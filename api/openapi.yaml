openapi: 3.1.0
info:
  title: Labor Market Analytics API (LMA)
  description: |
    Публичный REST контракт BFF для React SPA (IT Labor Market Analytics).
    Это канонический контракт; docs/architecture/03-api.md описывает его семантику и внутреннее отображение.
    Salary-поля поддерживают RUB/USD/EUR/CNY/KZT/AMD; канон хранения остаётся RUB/net.
    AI- и Perspectives («Тенденции»)-маршруты помечены x-lifecycle: target.
  version: 1.0.0
  contact:
    name: LMA
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080
    description: Local BFF
  - url: https://{host}
    description: Deployed
    variables:
      host:
        default: api.example.com

# MVP read API is intentionally public. Admin operations override this with AdminToken.
security: []

tags:
  - name: dashboard
    description: Сводные показатели рынка
  - name: roles
    description: Аналитика по ролям
  - name: regions
    description: Аналитика по регионам
  - name: trends
    description: Временные ряды (salary/demand MVP; perspectives Target)
  - name: skills
    description: Востребованные навыки
  - name: rankings
    description: Текущие рейтинги рынка по количеству и зарплате
  - name: vacancies
    description: OLTP drill-down вакансий
  - name: currencies
    description: Метаданные официальных дневных курсов
  - name: admin
    description: Управление ingest
  - name: ai
    description: Будущий асинхронный AI-анализ
  - name: assistant
    description: Персональный assistant вакансий (Phase 4-shaped, identity required)
  - name: perspectives
    description: «Тенденции» — multi-source composite scores (Phase 5 Target)
  - name: health
    description: Проверка доступности BFF

paths:
  /api/v1/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Публичный health
      responses:
        "200":
          description: |
            OK. Phase 0: HTTP 200 даже при degraded deps.
            checks.database / checks.redis — только если заданы DATABASE_URL / REDIS_URL.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                    example: ok
                  checks:
                    type: object
                    additionalProperties:
                      type: string
                      enum: [up, down]
                    example:
                      database: up
                      redis: up

  /api/v1/dashboard/summary:
    get:
      tags: [dashboard]
      operationId: getDashboardSummary
      summary: Сводка для главной
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/RoleIdOptional"
        - $ref: "#/components/parameters/RegionIdOptional"
        - $ref: "#/components/parameters/Currency"
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/DependencyUnavailable"

  /api/v1/roles:
    get:
      tags: [roles]
      operationId: listRoles
      summary: Список ролей со спросом
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/RegionIdOptional"
        - $ref: "#/components/parameters/SourceOptional"
        - $ref: "#/components/parameters/PublishedFromOptional"
        - $ref: "#/components/parameters/PublishedToOptional"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: sort
          in: query
          schema:
            type: string
            enum: [count, median_salary]
            default: count
      responses:
        "200":
          description: Paginated roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleStatPage"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/roles/{role_id}:
    get:
      tags: [roles]
      operationId: getRole
      summary: Детали роли
      parameters:
        - $ref: "#/components/parameters/RoleIdPath"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/RegionIdOptional"
      responses:
        "200":
          description: Role detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleStat"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/regions:
    get:
      tags: [regions]
      operationId: listRegions
      summary: Список регионов
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/RoleIdOptional"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated regions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionStatPage"

  /api/v1/regions/{region_id}:
    get:
      tags: [regions]
      operationId: getRegion
      summary: Детали региона
      parameters:
        - $ref: "#/components/parameters/RegionIdPath"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Region detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionStat"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/trends/salaries:
    get:
      tags: [trends]
      operationId: getSalaryTrends
      summary: Ряд медиан/перцентилей зарплат (offered)
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/RoleIdOptional"
        - $ref: "#/components/parameters/RegionIdOptional"
        - $ref: "#/components/parameters/Grain"
        - $ref: "#/components/parameters/Currency"
      responses:
        "200":
          description: Salary series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryTrendsResponse"

  /api/v1/trends/demand:
    get:
      tags: [trends]
      operationId: getDemandTrends
      summary: Спрос (active/published) из полных снимков
      description: |
        Исторический active_count читается только из persisted snapshots.
        new_count сохранён как deprecated alias published_count.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/RoleGroupOptional"
        - $ref: "#/components/parameters/RegionIdOptional"
        - $ref: "#/components/parameters/SourceOptional"
        - $ref: "#/components/parameters/DemandGrain"
        - $ref: "#/components/parameters/Currency"
      responses:
        "200":
          description: Ряд снимков или явный пустой ряд, если полных снимков нет
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemandTrendsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/trends/coverage:
    get:
      tags: [trends]
      operationId: getTrendsCoverage
      summary: Покрытие Phase 1 market snapshots
      responses:
        "200":
          description: Доступные годы, границы наблюдений и полнота снимков
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendsCoverage"

  /api/v1/trends/perspectives:
    get:
      tags: [trends, perspectives]
      operationId: listPerspectives
      summary: Рейтинг направлений «Тенденции» (composite heuristic)
      description: |
        Phase 5 Target. Составной score по jobs / learning / media.
        Не путать с vacancy-only `/trends/salaries` и `/trends/demand`.
      x-lifecycle: target
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: role_family
          in: query
          schema:
            type: string
          description: Фильтр семейства ролей (backend, data, …)
        - name: score_version
          in: query
          schema:
            type: string
          description: Версия формулы; по умолчанию — текущая
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Ranked directions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerspectivesPage"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/trends/perspectives/{direction_key}:
    get:
      tags: [trends, perspectives]
      operationId: getPerspectiveDirection
      summary: Деталь направления и ряды компонентов score
      x-lifecycle: target
      parameters:
        - name: direction_key
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Grain"
        - name: score_version
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Direction detail with series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerspectiveDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/skills/top:
    get:
      tags: [skills]
      operationId: getTopSkills
      summary: Топ навыков
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/RoleIdOptional"
        - $ref: "#/components/parameters/RegionIdOptional"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: limit
          in: query
          deprecated: true
          description: Совместимый alias `page_size` для первой страницы; не сочетать с `page` или `page_size`.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Top skills
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopSkillsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/rankings/programming-languages:
    get:
      tags: [rankings]
      operationId: getProgrammingLanguageRanking
      summary: Рейтинг языков программирования
      description: Текущий срез активных вакансий listing scope; SQL, HTML/CSS, Bash и 1C исключены политикой taxonomy.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/RoleIdOptional"
        - $ref: "#/components/parameters/RegionIdOptional"
        - $ref: "#/components/parameters/SourceOptional"
        - $ref: "#/components/parameters/RankingMetric"
        - $ref: "#/components/parameters/Currency"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Страница рейтинга языков
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankingPage"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/rankings/managerial-roles:
    get:
      tags: [rankings]
      operationId: getManagerialRoleRanking
      summary: Рейтинг управленческих и аналитических IT-ролей
      description: Отдельный management analytics scope по официальным professional_role ID HH; не расширяет `/vacancies`.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/RegionIdOptional"
        - $ref: "#/components/parameters/SourceOptional"
        - $ref: "#/components/parameters/RankingMetric"
        - $ref: "#/components/parameters/Currency"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Страница рейтинга ролей
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankingPage"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/vacancies:
    get:
      tags: [vacancies]
      operationId: listVacancies
      summary: Список вакансий (OLTP drill-down)
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/RoleIdsOptional"
        - $ref: "#/components/parameters/RegionIdsOptional"
        - $ref: "#/components/parameters/SkillIdsOptional"
        - $ref: "#/components/parameters/SalaryMinOptional"
        - $ref: "#/components/parameters/SalaryMaxOptional"
        - $ref: "#/components/parameters/SourceOptional"
        - $ref: "#/components/parameters/Currency"
        - name: only_active
          in: query
          schema:
            type: boolean
            default: true
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Vacancy page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VacancyPage"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/currencies:
    get:
      tags: [currencies]
      operationId: listCurrencies
      summary: Поддерживаемые валюты и свежесть курса ЦБ
      responses:
        "200":
          description: Публичные метаданные дневных официальных курсов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrenciesResponse"

  /api/v1/admin/ingest/runs:
    post:
      tags: [admin]
      operationId: triggerIngest
      summary: Ручной запуск ingest
      security:
        - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerIngestRequest"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerIngestResponse"
        "409":
          description: Ingest already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/admin/ingest/runs/{run_id}:
    get:
      tags: [admin]
      operationId: getIngestRun
      summary: Статус ingest run
      security:
        - AdminToken: []
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestRun"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/ai/analyses:
    post:
      tags: [ai]
      operationId: startAIAnalysis
      summary: Запуск AI-анализа (Target)
      x-lifecycle: target
      security:
        - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartAIAnalysisRequest"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartAIAnalysisResponse"

  /api/v1/ai/insights/{id}:
    get:
      tags: [ai]
      operationId: getAIInsight
      summary: Получить AI insight (Target)
      x-lifecycle: target
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Insight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIInsight"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/assistant/preferences:
    description: |
      In local/dev with ASSISTANT_DEV_AUTH_ENABLED=true, the BFF uses the
      deterministic server-side dev subject (or X-Dev-User when supplied).
      PUT, PATCH, and POST append an immutable preference version.
    get:
      tags: [assistant]
      operationId: getAssistantPreferences
      summary: Получить текущие персональные критерии
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Текущая версия критериев
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantPreferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [assistant]
      operationId: saveAssistantPreferences
      summary: Сохранить новую версию критериев
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantPreferencesRequest"
      responses:
        "200":
          description: Сохранённая версия
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantPreferences"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [assistant]
      operationId: patchAssistantPreferences
      summary: Сохранить новую версию критериев
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantPreferencesRequest"
      responses:
        "200":
          description: Сохранённая версия
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantPreferences"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/assistant/preferences/list:
    get:
      tags: [assistant]
      operationId: listAssistantPreferences
      summary: История версий критериев
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Версии, включая архивные
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AssistantPreferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/assistant/preferences/archive:
    post:
      tags: [assistant]
      operationId: archiveAssistantPreference
      summary: Архивировать версию критериев
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, format: uuid }
      responses:
        "204": { description: Версия архивирована; данные и evidence сохранены }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/assistant/status:
    get:
      tags: [assistant]
      operationId: getAssistantStatus
      summary: Статус последнего анализа снимка вакансий
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Durable status and aggregate counters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/assistant/analyze:
    get:
      tags: [assistant]
      operationId: previewAssistantAnalysis
      summary: Получить размер текущего снимка до подтверждения
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Число активных вакансий, которые войдут в новый снимок
          content:
            application/json:
              schema:
                type: object
                required: [snapshot_total]
                properties:
                  snapshot_total: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [assistant]
      operationId: runAssistantAnalysis
      summary: Запустить анализ всех текущих вакансий
      description: >-
        Фиксирует конечный снимок всех активных неудалённых вакансий активных
        источников и обрабатывает его bounded keyset-пакетами. Новые вакансии
        после cutoff остаются для следующего запуска и инкрементального outbox.
        При пользовательском opt-in и server-side флаге AI получает каждую
        вакансию снимка, включая ограниченное безопасное текстовое описание;
        deterministic reject не исключает AI-проверку. Число AI-запросов не
        ограничено: каждый элемент снимка может создать платный запрос.
      security:
        - bearerAuth: []
      responses:
        "202": { description: Queued }
        "409": { description: Уже выполняется }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/assistant/matches:
    get:
      tags: [assistant]
      operationId: listAssistantMatches
      summary: Получить персональные совпадения
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Совпадения
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssistantMatch"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/assistant/telegram/link:
    post:
      tags: [assistant]
      operationId: createTelegramLink
      summary: Создать одноразовую ссылку Telegram
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deep-link без bot token
          content:
            application/json:
              schema:
                type: object
                required: [deep_link, expires_at]
                properties:
                  deep_link: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/assistant/telegram:
    get:
      tags: [assistant]
      operationId: getTelegramStatus
      summary: Статус Telegram connection
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Статус
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [assistant]
      operationId: revokeTelegram
      summary: Отозвать Telegram connection
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Отозвано
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [assistant]
      operationId: updateTelegramOptIn
      summary: Изменить отдельное согласие на Telegram-уведомления
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opted_in]
              properties:
                opted_in: { type: boolean }
      responses:
        "200":
          description: Согласие изменено
          content:
            application/json:
              schema:
                type: object
                required: [opted_in]
                properties:
                  opted_in: { type: boolean }
        "409":
          description: Telegram не связан и не подтверждён
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/assistant/telegram/test:
    post:
      tags: [assistant]
      operationId: sendTelegramTestNotification
      summary: Отправить явно подтверждённое тестовое уведомление
      description: Реальная отправка возможна только после verified link и opt-in; chat_id из клиента не принимается.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: boolean, const: true }
      responses:
        "200": { description: Отправлено }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Telegram не подтверждён }
        "503": { description: Telegram sender не настроен }
  /api/v1/assistant/automation:
    get:
      tags: [assistant]
      operationId: getAssistantAutomation
      summary: Получить настройки автоматического анализа
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Персональные opt-in настройки и activation cutoff
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantAutomationSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [assistant]
      operationId: updateAssistantAutomation
      summary: Включить или выключить AI и Telegram отдельно
      description: Включение AI фиксирует activation_at; каждая новая или содержательно изменившаяся вакансия после него анализируется по описанию без лимита количества запросов. Старые вакансии не backfill-ятся.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ai_enabled: { type: boolean }
                telegram_enabled: { type: boolean }
      responses:
        "200":
          description: Сохранённые настройки
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantAutomationSettings" }
        "409":
          description: Серверный provider не настроен
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    AdminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: MVP admin gate; Target — Bearer JWT
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Currency:
      name: currency
      in: query
      description: Валюта отображения; конвертация не изменяет канонические RUB/net суммы.
      schema:
        type: string
        enum: [RUB, USD, EUR, CNY, KZT, AMD]
        default: RUB
    From:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date
    To:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date
    RoleIdOptional:
      name: role_id
      in: query
      schema:
        type: string
    RoleGroupOptional:
      name: role_group
      in: query
      description: Утверждённая группа официальных HH professional roles.
      schema:
        type: string
        enum: [software_development, analytics, quality_assurance]
    RegionIdOptional:
      name: region_id
      in: query
      schema:
        type: string
    RoleIdsOptional:
      name: role_id
      in: query
      style: form
      explode: false
      description: До 20 канонических UUID ролей через запятую; совпадение ANY.
      schema:
        type: array
        maxItems: 20
        items: { type: string, format: uuid }
    RegionIdsOptional:
      name: region_id
      in: query
      style: form
      explode: false
      description: До 20 канонических UUID регионов через запятую; совпадение ANY.
      schema:
        type: array
        maxItems: 20
        items: { type: string, format: uuid }
    SkillIdsOptional:
      name: skill_id
      in: query
      style: form
      explode: false
      description: До 20 UUID навыков через запятую; вакансия совпадает хотя бы по одному навыку (ANY).
      schema:
        type: array
        maxItems: 20
        items: { type: string, format: uuid }
    SalaryMinOptional:
      name: salary_min
      in: query
      description: Нижняя граница salary_mid в выбранной валюте отображения; вакансии без canonical RUB/net не совпадают.
      schema:
        type: number
        minimum: 0
        maximum: 2000000
    SalaryMaxOptional:
      name: salary_max
      in: query
      description: Верхняя граница salary_mid в выбранной валюте отображения; вакансии без canonical RUB/net не совпадают.
      schema:
        type: number
        minimum: 0
        maximum: 2000000
    RoleIdPath:
      name: role_id
      in: path
      required: true
      schema:
        type: string
    RegionIdPath:
      name: region_id
      in: path
      required: true
      schema:
        type: string
    SourceOptional:
      name: source
      in: query
      schema:
        type: string
        enum: [hh, superjob, remotive, adzuna]
    PublishedFromOptional:
      name: published_from
      in: query
      description: Нижняя граница published_at, включительно; дата трактуется как 00:00:00 UTC.
      schema:
        type: string
        oneOf:
          - { type: string, format: date }
          - { type: string, format: date-time }
    PublishedToOptional:
      name: published_to
      in: query
      description: Верхняя граница published_at, исключительно; дата трактуется как начало следующего дня UTC.
      schema:
        type: string
        oneOf:
          - { type: string, format: date }
          - { type: string, format: date-time }
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    RankingMetric:
      name: metric
      in: query
      description: Count ранжирует по числу вакансий; salary — по медиане RUB/net только при выборке не менее 5.
      schema:
        type: string
        enum: [count, salary]
        default: count
    Grain:
      name: grain
      in: query
      schema:
        type: string
        enum: [day, week, month]
        default: week
    DemandGrain:
      name: grain
      in: query
      schema:
        type: string
        enum: [day, week]
        default: week
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DependencyUnavailable:
      description: Upstream gRPC/DB unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              examples: [VALIDATION_ERROR, CONFLICT, RATE_LIMITED, DEPENDENCY_UNAVAILABLE]
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            request_id:
              type: string

    Period:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date

    RoleCount:
      type: object
      properties:
        role_id: { type: string }
        title: { type: string }
        count: { type: integer }

    RegionCount:
      type: object
      properties:
        region_id: { type: string }
        title: { type: string }
        count: { type: integer }

    DashboardSummary:
      type: object
      required:
        - period
        - vacancies_active
        - median_salary
        - salary_currency
      properties:
        period:
          $ref: "#/components/schemas/Period"
        vacancies_active:
          type: integer
        vacancies_new:
          type: integer
        median_salary:
          type: number
          description: Медиана offered salaries (net estimate, см. docs/architecture/15-normalization-rules.md)
        salary_currency:
          type: string
          enum: [RUB, USD, EUR, CNY, KZT, AMD]
        salary_rate_date: { type: [string, "null"], format: date }
        salary_rate_provider: { type: string, enum: [cbr] }
        salary_sample_size:
          type: integer
        top_roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleCount"
        top_regions:
          type: array
          items:
            $ref: "#/components/schemas/RegionCount"
        generated_at:
          type: string
          format: date-time
        cache:
          type: string
          enum: [HIT, MISS]

    RoleStat:
      type: object
      properties:
        role_id: { type: string }
        title: { type: string }
        vacancies_count: { type: integer }
        median_salary: { type: number }
        p25_salary: { type: number }
        p75_salary: { type: number }
        currency: { type: string, enum: [RUB, USD, EUR, CNY, KZT, AMD] }
        rate_date: { type: [string, "null"], format: date }
        rate_provider: { type: string, enum: [cbr] }

    RoleStatPage:
      type: object
      required: [data, page, page_size, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RoleStat"
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    RegionStat:
      type: object
      properties:
        region_id: { type: string }
        title: { type: string }
        vacancies_count: { type: integer }
        median_salary: { type: number }
        p25_salary: { type: number }
        p75_salary: { type: number }
        currency: { type: string, enum: [RUB, USD, EUR, CNY, KZT, AMD] }
        rate_date: { type: [string, "null"], format: date }
        rate_provider: { type: string, enum: [cbr] }

    RegionStatPage:
      type: object
      required: [data, page, page_size, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RegionStat"
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    SalaryPoint:
      type: object
      properties:
        period_start: { type: string, format: date }
        median: { type: [number, "null"] }
        p25: { type: [number, "null"] }
        p75: { type: [number, "null"] }
        sample_size: { type: integer }
        rate_date: { type: [string, "null"], format: date }
        rate_provider: { type: string, enum: [cbr] }
        coverage_warning: { type: string, enum: [fx_rate_unavailable] }

    SalaryTrendsResponse:
      type: object
      properties:
        grain: { type: string }
        currency: { type: string, enum: [RUB, USD, EUR, CNY, KZT, AMD] }
        points:
          type: array
          items:
            $ref: "#/components/schemas/SalaryPoint"

    DemandPoint:
      type: object
      required:
        - period_start
        - active_count
        - published_count
        - new_count
        - complete
        - source_day_count
      properties:
        period_start: { type: string, format: date }
        active_count: { type: integer }
        published_count:
          type: integer
          description: Число вакансий с published_at в UTC-окне снимка.
        new_count:
          type: integer
          deprecated: true
          description: Deprecated alias published_count для обратной совместимости.
        complete:
          type: boolean
        source_day_count:
          type: integer
          minimum: 1
          maximum: 7
        median_salary: { type: [number, "null"] }
        currency: { type: string, enum: [RUB, USD, EUR, CNY, KZT, AMD] }
        rate_date: { type: [string, "null"], format: date }
        rate_provider: { type: string, enum: [cbr] }
        coverage_warning: { type: string, enum: [fx_rate_unavailable] }

    DemandTrendsResponse:
      type: object
      required: [grain, status, source, points]
      properties:
        grain: { type: string, enum: [day, week] }
        status:
          type: string
          enum: [ready, no_complete_snapshots]
        source: { type: string, enum: [hh] }
        method_version: { type: string }
        points:
          type: array
          items:
            $ref: "#/components/schemas/DemandPoint"

    CoverageRegion:
      type: object
      required: [region_id, name]
      properties:
        region_id: { type: string, format: uuid }
        name: { type: string }

    TrendsCoverage:
      type: object
      required:
        - status
        - source
        - available_years
        - first_observation
        - last_observation
        - publication_from
        - publication_to
        - complete_daily_count
        - complete_weekly_count
        - expected_daily_count
        - missed_daily_count
        - incomplete_daily_count
        - latest_incomplete_date
        - next_scheduled_cycle
        - latest_complete_cycle
        - regions
      properties:
        status:
          type: string
          enum: [ready, collecting, degraded]
        source: { type: string, enum: [hh] }
        method_version: { type: string }
        available_years:
          type: array
          items: { type: integer, minimum: 2026 }
        first_observation: { type: [string, "null"], format: date }
        last_observation: { type: [string, "null"], format: date }
        publication_from: { type: [string, "null"], format: date }
        publication_to: { type: [string, "null"], format: date }
        complete_daily_count: { type: integer, minimum: 0 }
        complete_weekly_count: { type: integer, minimum: 0 }
        expected_daily_count: { type: integer, minimum: 0 }
        missed_daily_count: { type: integer, minimum: 0 }
        incomplete_daily_count: { type: integer, minimum: 0 }
        latest_incomplete_date: { type: [string, "null"], format: date }
        next_scheduled_cycle: { type: string, format: date-time }
        latest_complete_cycle: { type: [string, "null"], format: date-time }
        regions:
          type: array
          items:
            $ref: "#/components/schemas/CoverageRegion"

    PerspectiveCoverage:
      type: object
      properties:
        jobs: { type: boolean }
        edu: { type: boolean }
        media: { type: boolean }

    PerspectiveDirection:
      type: object
      properties:
        direction_key: { type: string }
        title: { type: string }
        role_family: { type: string }
        composite_score: { type: number }
        demand_component: { type: number }
        learning_component: { type: number }
        media_component: { type: number }
        coverage:
          $ref: "#/components/schemas/PerspectiveCoverage"
        delta:
          type: number
          description: Изменение composite_score к предыдущему окну (опц.)

    PerspectivesPage:
      type: object
      required: [period, score_version, disclaimer, data, page, page_size, total]
      properties:
        period:
          $ref: "#/components/schemas/Period"
        score_version: { type: string }
        disclaimer:
          type: string
          example: Composite heuristic from jobs, learning, and media signals — not a forecast.
        data:
          type: array
          items:
            $ref: "#/components/schemas/PerspectiveDirection"
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    PerspectiveScorePoint:
      type: object
      properties:
        period_start: { type: string, format: date }
        composite_score: { type: number }
        demand_component: { type: number }
        learning_component: { type: number }
        media_component: { type: number }

    PerspectiveDetail:
      type: object
      properties:
        direction_key: { type: string }
        title: { type: string }
        role_family: { type: string }
        score_version: { type: string }
        disclaimer: { type: string }
        grain: { type: string }
        latest:
          $ref: "#/components/schemas/PerspectiveDirection"
        points:
          type: array
          items:
            $ref: "#/components/schemas/PerspectiveScorePoint"

    SkillStat:
      type: object
      properties:
        skill_id: { type: string }
        name: { type: string }
        count: { type: integer }
        share: { type: number }

    TopSkillsResponse:
      type: object
      required: [data, page, page_size, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SkillStat"
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }

    RankingItem:
      type: object
      required:
        - id
        - name
        - rank
        - vacancy_count
        - share
        - median_salary_rub
        - salary_sample_size
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        rank: { type: integer, minimum: 1 }
        vacancy_count: { type: integer, minimum: 0 }
        share:
          type: number
          minimum: 0
          maximum: 1
        median_salary_rub: { type: [number, "null"] }
        median_salary: { type: [number, "null"] }
        salary_sample_size: { type: integer, minimum: 0 }

    RankingPage:
      type: object
      required:
        - data
        - metric
        - denominator
        - min_salary_sample_size
        - page
        - page_size
        - total
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RankingItem"
        metric: { type: string, enum: [count, salary] }
        denominator: { type: integer, minimum: 0 }
        min_salary_sample_size: { type: integer, minimum: 1 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        currency: { type: string, enum: [RUB, USD, EUR, CNY, KZT, AMD] }
        rate_date: { type: [string, "null"], format: date }
        rate_provider: { type: string, enum: [cbr] }

    Vacancy:
      type: object
      properties:
        id: { type: string, format: uuid }
        source: { type: string }
        source_name: { type: string }
        source_url: { type: [string, "null"], format: uri }
        external_id: { type: string }
        title: { type: string }
        role_id: { type: [string, "null"] }
        region_id: { type: [string, "null"] }
        salary_from: { type: [number, "null"] }
        salary_to: { type: [number, "null"] }
        salary_currency: { type: [string, "null"] }
        salary_gross: { type: [boolean, "null"] }
        salary_from_rub_net: { type: [number, "null"] }
        salary_to_rub_net: { type: [number, "null"] }
        salary_rate_date: { type: [string, "null"], format: date }
        salary_rate_provider: { type: string, enum: [cbr] }
        published_at: { type: [string, "null"], format: date-time }
        first_observed_at:
          type: [string, "null"]
          format: date-time
          description: UTC-время первого наблюдения вакансии ingest-пайплайном; не меняется при повторном сборе.
        is_fresh:
          type: boolean
          description: true только для вакансий HH, если published_at находится в UTC-окне [server_now-5h, server_now] с включёнными границами. NULL и будущие значения считаются не свежими; first_observed_at для этого поля не используется.
        is_active: { type: boolean }
        status:
          type: string
          enum: [active, inactive, missing_from_last_complete_cycle]
          description: Машиночитаемый статус доступности вакансии; active не означает активность работодателя.
        deactivated_at:
          type: [string, "null"]
          format: date-time
        skills:
          type: array
          items: { type: string }

    VacancyPage:
      type: object
      required: [data, page, page_size, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Vacancy"
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    CurrencyRate:
      type: object
      required: [code, label, symbol, rate_date, stale_days, available]
      properties:
        code: { type: string, enum: [RUB, USD, EUR, CNY, KZT, AMD] }
        label: { type: string }
        symbol: { type: string }
        rate_date: { type: [string, "null"], format: date }
        provider: { type: string, enum: [cbr] }
        stale_days: { type: [integer, "null"], minimum: 0 }
        available: { type: boolean }

    CurrenciesResponse:
      type: object
      required: [base_currency, rates]
      properties:
        base_currency: { type: string, const: RUB }
        rates:
          type: array
          items:
            $ref: "#/components/schemas/CurrencyRate"

    TriggerIngestRequest:
      type: object
      required: [source, mode]
      properties:
        source:
          type: string
          enum: [hh, superjob, remotive, adzuna]
        mode:
          type: string
          enum: [full, incremental]
        params:
          type: object
          additionalProperties:
            type: string
          example:
            area: "1"
            text: golang
            date_from: "2026-08-10"

    TriggerIngestResponse:
      type: object
      properties:
        run_id: { type: string }
        status: { type: string, example: queued }
        source: { type: string }

    IngestStats:
      type: object
      properties:
        fetched: { type: integer }
        excluded_out_of_scope:
          type: integer
          description: HH-вакансии без разрешённой официальной professional role; агрегат без PII.
        published:
          type: integer
          description: Число записей, переданных следующему этапу pipeline (in-process в Phase 1 или Kafka в Phase 2).
        errors: { type: integer }

    IngestRun:
      type: object
      properties:
        run_id: { type: string }
        source: { type: string }
        mode: { type: string }
        status:
          type: string
          enum: [queued, running, success, partial, failed]
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        stats:
          $ref: "#/components/schemas/IngestStats"
        error_message:
          type: [string, "null"]

    StartAIAnalysisRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [role_trend, vacancy_cluster, skills_shift]
        role_id: { type: string }
        region_id: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        prompt_version: { type: string }

    StartAIAnalysisResponse:
      type: object
      properties:
        job_id: { type: string }
        status: { type: string }

    AIInsight:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        status: { type: string }
        summary: { type: string }
        bullets:
          type: array
          items: { type: string }
        prompt_version: { type: string }
        model: { type: string }
        needs_human_review: { type: boolean }
        created_at: { type: string, format: date-time }

    AssistantPreferencesRequest:
      type: object
      required: [hard_criteria, soft_criteria, weights]
      properties:
        note: { type: string, maxLength: 2000 }
        hard_criteria:
          type: object
          additionalProperties: false
          properties:
            approved_roles:
              type: array
              uniqueItems: true
              items:
                type: string
                enum: ["96", "104", "148", "150", "156", "164", "124"]
              description: Утверждённые official HH professional role IDs.
            specialization:
              type: string
              enum: [frontend, backend, fullstack, mobile, devops_platform, data_ml, other]
              description: Явная специализация для широкой роли HH 96; свободная заметка её не задаёт.
            include_leadership:
              type: boolean
              default: false
              description: Явное разрешение руководящих вакансий; при false lead/team lead/head исключаются.
            role:
              type: string
              deprecated: true
              description: Legacy alias; только известные значения нормализуются в approved_roles, неизвестные возвращают 400.
            regions:
              type: array
              items: { type: string }
            required_skills:
              type: array
              items: { type: string }
            excluded_skills:
              type: array
              items: { type: string }
            remote_only: { type: boolean }
            min_salary_rub: { type: number, minimum: 0 }
        soft_criteria:
          type: object
          additionalProperties: false
        weights:
          type: object
          additionalProperties:
            type: number
            minimum: 0

    AssistantPreferences:
      allOf:
        - $ref: "#/components/schemas/AssistantPreferencesRequest"
        - type: object
          required: [version, active_from]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer, minimum: 1 }
            active_from: { type: string, format: date-time }
            archived_at: { type: [string, "null"], format: date-time }
            legacy_role_upgraded:
              type: boolean
              description: Ответ построен из legacy role; сохранение создаст новую нормализованную immutable-версию.
            legacy_specialization_suggestion:
              type: string
              enum: [frontend, backend, fullstack]
              description: Неподтверждённая подсказка из известного legacy role; клиент должен запросить явный выбор.

    AssistantStatus:
      type: object
      required: [ai_configured, ai_status, state, processed, total, eligible, matched, ai_eligible, ai_calls, ai_succeeded, ai_matches, ai_failures, ai_skipped, ai_http_attempts, ai_retries, ai_batches, ai_prompt_tokens, ai_completion_tokens, ai_cached_tokens, ai_rate_limit, ai_timeouts, ai_invalid_responses, ai_auth, ai_quota, ai_server, ai_network, ai_context_limit, ai_content_filter, ai_invalid_request, skipped, pending_candidates]
      properties:
        run_id: { type: string, format: uuid }
        ai_configured: { type: boolean }
        ai_status:
          type: string
          enum: [not_run, pending, running, completed, partial, failed, skipped]
        ai_skip_reason:
          type: [string, "null"]
          enum: [server_disabled, user_opt_out, run_predates_ai, no_eligible, budget_exhausted, already_analyzed, provider_unavailable, unknown, null]
        state: { type: string, enum: [never_run, queued, running, paused, succeeded, failed, disabled] }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        last_checked_at: { type: [string, "null"], format: date-time }
        processed: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        eligible: { type: integer, minimum: 0 }
        matched: { type: integer, minimum: 0 }
        ai_eligible: { type: integer, minimum: 0 }
        ai_calls:
          type: integer
          minimum: 0
          description: Число вакансий, отправленных AI-провайдеру; HTTP retries не включены.
        ai_succeeded: { type: integer, minimum: 0 }
        ai_matches: { type: integer, minimum: 0 }
        ai_failures: { type: integer, minimum: 0 }
        ai_skipped: { type: integer, minimum: 0 }
        ai_http_attempts: { type: integer, minimum: 0 }
        ai_retries: { type: integer, minimum: 0 }
        ai_batches:
          type: integer
          minimum: 0
          description: Логические AI-пакеты, включая пакеты после рекурсивного разделения.
        ai_prompt_tokens: { type: integer, minimum: 0 }
        ai_completion_tokens: { type: integer, minimum: 0 }
        ai_cached_tokens:
          type: integer
          minimum: 0
          description: Входные токены из provider prompt cache; 0 также допустим для исторических запусков.
        ai_rate_limit: { type: integer, minimum: 0 }
        ai_timeouts: { type: integer, minimum: 0 }
        ai_invalid_responses: { type: integer, minimum: 0 }
        ai_auth: { type: integer, minimum: 0 }
        ai_quota: { type: integer, minimum: 0 }
        ai_server: { type: integer, minimum: 0 }
        ai_network: { type: integer, minimum: 0 }
        ai_context_limit: { type: integer, minimum: 0 }
        ai_content_filter: { type: integer, minimum: 0 }
        ai_invalid_request: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        error_category: { type: [string, "null"] }
        request_id: { type: [string, "null"] }
        cursor_source: { type: string }
        cursor_observed_at: { type: [string, "null"], format: date-time }
        pending_candidates: { type: boolean }
        provider: { type: [string, "null"] }
        model: { type: [string, "null"] }
        prompt_version: { type: [string, "null"] }
        method_version: { type: string }

    AssistantMatch:
      type: object
      required: [vacancy_id, decision, score, method, stage, reasons, unknowns, conflicts, evidence_ids]
      properties:
        vacancy_id: { type: string, format: uuid }
        title: { type: string }
        source_url: { type: [string, "null"], format: uri }
        decision: { type: string, enum: [match, reject, review] }
        score: { type: number, minimum: 0, maximum: 1 }
        method: { type: string, enum: [deterministic, ai] }
        stage:
          type: string
          enum: [preliminary, confirmed]
          description: confirmed только для положительного AI-решения; deterministic match остаётся preliminary.
        confidence: { type: [string, "null"], enum: [low, medium, high, null] }
        reasons: { type: array, items: { type: string } }
        unknowns: { type: array, items: { type: string } }
        conflicts: { type: array, items: { type: string } }
        evidence_ids: { type: array, items: { type: string } }

    TelegramStatus:
      type: object
      required: [configured, linked, opted_in, pending, sent, failed, dead_lettered, last_error]
      properties:
        configured: { type: boolean }
        linked: { type: boolean }
        opted_in: { type: boolean }
        pending: { type: integer, minimum: 0 }
        sent: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        dead_lettered: { type: integer, minimum: 0 }
        last_error: { type: string }

    AssistantAutomationSettings:
      type: object
      required: [ai_enabled, telegram_enabled]
      properties:
        ai_enabled: { type: boolean }
        telegram_enabled: { type: boolean }
        activation_at:
          type: [string, "null"]
          format: date-time
          description: Cutoff включения; вакансии, наблюдённые ранее, не backfill-ятся.
