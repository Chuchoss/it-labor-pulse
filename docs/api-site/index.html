<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Project Pages live under /<repo>/ — required so ./openapi.yaml resolves correctly without a trailing slash. -->
    <base href="/it-labor-pulse/" />
    <title>IT Labor Pulse API</title>
    <style>
      :root {
        --nav-bg: #0f172a;
        --nav-fg: #f8fafc;
        --nav-muted: #94a3b8;
        --nav-link: #7dd3fc;
        --nav-link-hover: #e0f2fe;
        --accent: #38bdf8;
      }
      body {
        margin: 0;
        padding: 0;
      }
      .api-site-nav {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 20px;
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 14px;
        padding: 12px 20px;
        background: var(--nav-bg);
        color: var(--nav-fg);
        border-bottom: 1px solid #1e293b;
      }
      .api-site-brand {
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.01em;
        margin-right: 8px;
      }
      .api-site-brand span {
        color: var(--accent);
      }
      .api-site-tabs {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .api-site-nav a {
        color: var(--nav-link);
        text-decoration: none;
        padding: 4px 10px;
        border-radius: 6px;
      }
      .api-site-nav a:hover {
        color: var(--nav-link-hover);
        background: rgba(125, 211, 252, 0.08);
      }
      .api-site-nav .current {
        color: var(--nav-fg);
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 6px;
        background: rgba(248, 250, 252, 0.08);
      }
      .api-site-note {
        color: var(--nav-muted);
        font-size: 12px;
        margin-left: auto;
      }
      .api-site-note code {
        color: #cbd5e1;
        font-size: 11px;
      }
      @media (max-width: 720px) {
        .api-site-note {
          margin-left: 0;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <nav class="api-site-nav" aria-label="API docs">
      <div class="api-site-brand">IT Labor Pulse <span>API</span></div>
      <div class="api-site-tabs">
        <span class="current" aria-current="page">Redoc</span>
        <a href="swagger.html">Swagger UI</a>
      </div>
      <span class="api-site-note">
        Spec: <code>api/openapi.yaml</code> · UI via CDN
      </span>
    </nav>
    <!--
      Spec file openapi.yaml is produced by CI (copy from api/openapi.yaml).
      Do not commit a duplicate OpenAPI as source of truth.
    -->
    <redoc
      spec-url="./openapi.yaml"
      hide-download-button="false"
      expand-responses="200,201"
    ></redoc>
    <script src="https://cdn.jsdelivr.net/npm/redoc@2/bundles/redoc.standalone.js"></script>
  </body>
</html>
