<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LMA API — Redoc</title>
    <style>
      body {
        margin: 0;
        padding: 0;
      }
      .api-site-nav {
        font-family: system-ui, sans-serif;
        font-size: 14px;
        padding: 10px 16px;
        background: #1f2937;
        color: #f9fafb;
      }
      .api-site-nav a {
        color: #93c5fd;
        margin-right: 16px;
      }
      .api-site-nav a:hover {
        color: #dbeafe;
      }
      .api-site-nav .current {
        color: #f9fafb;
        font-weight: 600;
        margin-right: 16px;
      }
      .api-site-note {
        opacity: 0.75;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <nav class="api-site-nav" aria-label="API docs">
      <span class="current">Redoc</span>
      <a href="./swagger.html">Swagger UI (Try it)</a>
      <span class="api-site-note">
        Source of truth: <code>api/openapi.yaml</code> (copied here on Pages build).
        UI scripts from CDN — offline preview needs network.
      </span>
    </nav>
    <!--
      Spec file openapi.yaml is produced by CI (copy from api/openapi.yaml).
      Do not commit a duplicate OpenAPI as source of truth.
    -->
    <redoc spec-url="./openapi.yaml"></redoc>
    <script src="https://cdn.jsdelivr.net/npm/redoc@2/bundles/redoc.standalone.js"></script>
  </body>
</html>
